name: Stems ONNX

# Dedicated build for the optional stem separation backend. This does not touch
# ci.yml: it downloads ONNX Runtime, generates a tiny model with the
# demucs-onnx tensor contract, builds with STEM_SEPARATION=ON and runs only the
# backend tests.

on:
  pull_request:
    paths:
      - "src/stems/**"
      - "src/test/demucsonnxseparatortest.cpp"
      - "lib/demucs-onnx/**"
      - "tools/make_test_demucs_onnx.py"
      - "cmake/modules/Findonnxruntime.cmake"
      - "CMakeLists.txt"
      - "docs/stems-onnx.md"
      - ".github/workflows/stems-onnx.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-ort:
    name: Linux x64 + ONNX Runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPRESS: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: tools/debian_buildenv.sh setup

      - name: Install ONNX Runtime
        run: |
          set -euo pipefail
          version=1.32.0
          # The upstream GitHub release tarball is unavailable, so use the
          # NuGet package: it ships the same headers and Linux x64 library.
          url="https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime/${version}"
          root="${RUNNER_TEMP}/onnxruntime"
          pkg="${RUNNER_TEMP}/ort"
          mkdir -p "${root}/include" "${root}/lib" "${pkg}"
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors \
            --connect-timeout 30 -o "${RUNNER_TEMP}/ort.nupkg" "${url}"
          unzip -q "${RUNNER_TEMP}/ort.nupkg" \
            'build/native/include/*' 'runtimes/linux-x64/native/*' -d "${pkg}"
          cp -R "${pkg}/build/native/include/." "${root}/include/"
          cp -R "${pkg}/runtimes/linux-x64/native/." "${root}/lib/"
          # The NuGet library has SONAME libonnxruntime.so.1 but ships without
          # the matching symlink, so provide it and put the directory on the
          # loader path for the test binaries.
          ln -sf libonnxruntime.so "${root}/lib/libonnxruntime.so.1"
          echo "STEM_SEPARATION_ORT_ROOT=${root}" >> "${GITHUB_ENV}"
          echo "LD_LIBRARY_PATH=${root}/lib:${LD_LIBRARY_PATH:-}" >> "${GITHUB_ENV}"

      - name: Generate tiny test model
        run: |
          set -euo pipefail
          python3 -m pip install --user --quiet onnx || \
            python3 -m pip install --quiet --break-system-packages onnx
          out="${RUNNER_TEMP}/testmodel"
          python3 tools/make_test_demucs_onnx.py --out-dir "${out}"
          echo "PARAMIX_TEST_DEMUCS_ONNX=${out}/testdemucs.onnx" >> "${GITHUB_ENV}"

      - name: Restore ccache cache
        id: ccache_restore
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/ccache
          key: stems-ort-linux-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stems-ort-linux-

      - name: Set up ccache
        run: |
          ccache --zero-stats
          ccache --max-size=2G

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS_RELWITHDEBINFO="-O2 -DNDEBUG -g0" \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O2 -DNDEBUG -g0" \
            -DQML=ON \
            -DSTEM_SEPARATION=ON

      - name: Build backend tests
        run: cmake --build build --target mixxx-test --parallel "$(nproc)"

      - name: Test backend
        run: |
          export LD_LIBRARY_PATH="${STEM_SEPARATION_ORT_ROOT}/lib:${LD_LIBRARY_PATH:-}"
          ctest --test-dir build -R "DemucsOnnxSeparatorTest" --output-on-failure

      - name: Print compiler cache stats
        run: |
          ccache --show-stats --verbose
          ccache -p --print-stats
          ccache --show-stats --verbose >> "${GITHUB_STEP_SUMMARY}"
          ccache --cleanup

      - name: Save ccache cache
        # This workflow has no push trigger, so the previous
        # `event_name == 'push'` condition could never be true and the cache
        # was never written: every run compiled the backend tests cold
        # (measured 36m48s). Save on every run instead; the run id keeps the
        # key unique so the save cannot collide.
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/ccache
          key: stems-ort-linux-${{ github.run_id }}-${{ github.run_attempt }}
