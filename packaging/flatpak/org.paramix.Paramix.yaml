app-id: org.paramix.Paramix
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
command: paramix
rename-icon: paramix
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all
  - --share=network
  - --share=ipc
  - --filesystem=xdg-run/pipewire-0
  - --filesystem=xdg-music
  - --filesystem=/media
  - --filesystem=/run/media
  - --system-talk-name=org.freedesktop.UPower
  - --system-talk-name=org.freedesktop.RealtimeKit1
  - --talk-name=org.freedesktop.ScreenSaver
  - --env=ALSA_CONFIG_PATH=
  - --metadata=X-DConf=migrate-path=/org/paramix/Paramix
  - --persist=.paramix
add-extensions:
  org.freedesktop.LinuxAudio.Plugins:
    directory: extensions/Plugins
    version: "25.08"
    add-ld-path: lib
    merge-dirs: lv2
    subdirectories: true
    no-autodownload: true
cleanup:
  - "*.a"
  - "*.la"
modules:
  - modules/libmad.yaml
  - modules/lv2.yaml
  - modules/serd.yaml
  - modules/zix.yaml
  - modules/sord.yaml
  - modules/sratom.yaml
  - modules/lilv.yaml
  - modules/googletest.yaml
  - modules/benchmark.yaml
  - modules/gsl.yaml
  - modules/protobuf.yaml
  - modules/portaudio.yaml
  - modules/portmidi.yaml
  - modules/hidapi.yaml
  - modules/chromaprint.yaml
  - modules/rubberband.yaml
  - modules/soundtouch.yaml
  - modules/libid3tag.yaml
  - modules/upower.yaml
  - modules/fdk-aac-free.yaml
  - modules/libmodplug.yaml
  - modules/qtkeychain.yaml
  - modules/libebur128.yaml
  - modules/libkeyfinder.yaml
  - modules/libdjinterop.yaml
  - name: paramix
    buildsystem: cmake-ninja
    run-tests: true
    build-options:
      env:
        GTEST_COLOR: "1"
        CTEST_OUTPUT_ON_FAILURE: "1"
        CTEST_PARALLEL_LEVEL: "1"
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DINSTALL_USER_UDEV_RULES=OFF
      - -DBUILD_BENCH=OFF
      - -DBUILD_TESTING=ON
    sources:
      - type: dir
        path: ../../
      - commands:
          - export LV2_PATH=$HOME/.lv2:/app/extensions/Plugins/lv2:/app/lib/lv2
          - exec paramix.bin "$@"
        type: script
        dest-filename: paramix.sh
    cleanup:
      - /share/icons/hicolor/scalable/apps/paramix_ios.svg
      - /share/icons/hicolor/scalable/apps/paramix_macos.svg
    post-install:
      - desktop-file-edit --set-key="Exec" --set-value="paramix %U" ${FLATPAK_DEST}/share/applications/org.paramix.Paramix.desktop
      - mv ${FLATPAK_DEST}/bin/paramix ${FLATPAK_DEST}/bin/paramix.bin
      - install -Dm755 paramix.sh ${FLATPAK_DEST}/bin/paramix
      - install -Dm644 ./res/linux/org.paramix.Paramix.metainfo.xml /app/share/metainfo/org.paramix.Paramix.metainfo.xml
      - install -d /app/extensions/Plugins
